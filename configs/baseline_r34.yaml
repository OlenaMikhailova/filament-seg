# Baseline: U-Net / ResNet34, soft labels, 1024 px crops from full-resolution images.
data_root: /path/to/MAGFiLO_1.0_Kaggle_2026   # change me
cache_dir: cache
work_dir: runs/r34_f0
seed: 42
fold: 0            # 0..4 for CV; -1 = train on all images (final refit, no validation)
preprocess: flat   # flat | raw  (must match a cache/img_<mode> folder)
label_mode: soft   # soft | union | majority  (must match a cache/label_<mode> folder)

model:
  arch: Unet       # any segmentation_models_pytorch arch: Unet, UnetPlusPlus, FPN, ...
  encoder: resnet34
  weights: imagenet

train:
  crop: 1024
  batch_size: 8          # lower to 4 if GPU memory is short
  epochs: 40
  samples_per_epoch: 1600
  lr: 3.0e-4
  weight_decay: 1.0e-4
  dice_weight: 1.0
  pos_frac: 0.6          # share of crops centred near a filament
  num_workers: 8
  amp: true
  val_every: 5

infer:
  tile: 1024
  overlap: 256
  tta: true              # flips; used for final val probs and test, not during training
  batch: 4

post:                    # defaults; replace with tune_postprocess.py output
  thr: 0.5
  close_k: 15
  min_area: 150
  min_conf: 0.0
