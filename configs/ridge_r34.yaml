# ResNet34 U-Net on 3 input channels: flattened image + dark-ridge filter + black top-hat.
# Same training recipe as the 80-epoch baseline, so only the input changes.
data_root: /path/to/MAGFiLO_1.0_Kaggle_2026   # change me
cache_dir: cache
work_dir: runs/ridge_r34_f0
seed: 42
fold: 0
preprocess: ridge
label_mode: soft

model:
  arch: Unet
  encoder: resnet34
  weights: imagenet
  in_channels: 3

train:
  crop: 1024
  batch_size: 8
  epochs: 80
  samples_per_epoch: 1600
  lr: 3.0e-4
  weight_decay: 1.0e-4
  dice_weight: 1.0
  pos_frac: 0.6
  num_workers: 8
  amp: true
  val_every: 5

infer:
  tile: 1024
  overlap: 256
  tta: true
  batch: 4

post:
  thr: 0.4
  close_k: 9
  min_area: 200
  min_conf: 0.9